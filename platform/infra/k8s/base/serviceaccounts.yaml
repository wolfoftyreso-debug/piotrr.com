# Dedicated identities, one per workload.
#
# Both pods had `automountServiceAccountToken: false`, which is most of
# the value — no credential is projected into the container. But they
# were still *bound* to the namespace `default` ServiceAccount, so any
# RoleBinding anyone ever grants to `default` would silently apply to
# them, and an audit log entry attributing an action to `default` names
# nothing.
#
# These accounts have no RoleBinding on purpose: neither workload talks
# to the Kubernetes API. Least privilege here means an identity that
# exists, is named, and can do nothing (§9).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: baltic-bridge
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  namespace: baltic-bridge
automountServiceAccountToken: false
