# Local development environment (Section 3: RDS PostgreSQL 16 -> local pg16,
# S3 -> MinIO). Production uses RDS + S3 in eu-north-1.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baltic
      POSTGRES_PASSWORD: baltic
      POSTGRES_DB: baltic_bridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baltic"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: baltic
      MINIO_ROOT_PASSWORD: baltic-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the private documents bucket on startup (versioned like prod)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 baltic baltic-secret;
      mc mb --ignore-existing local/documents;
      mc version enable local/documents;
      exit 0"

volumes:
  pgdata:
  miniodata:
